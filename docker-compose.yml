# Barcode station — a SEPARATE Coolify resource (deploy from this directory).
# It has no database of its own: it shares the Planner's Postgres and talks to
# the Planner API over the network. Set these three to match the Planner
# deployment (Coolify → Environment Variables):
#   DATABASE_URL          the Planner Postgres (same DB the Planner uses)
#   PLANNER_API_URL       the Planner API base URL, e.g. https://planner.example.com/api
#   BARCODE_SYNC_TOKEN    the SAME token configured on the Planner
# Coolify assigns the public domain via SERVICE_FQDN_BARCODE_8000.
services:
  barcode:
    build:
      context: .
    environment:
      - SERVICE_FQDN_BARCODE_8000
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
      - PLANNER_SYNC_ENABLED=${PLANNER_SYNC_ENABLED:-true}
      - PLANNER_API_URL=${PLANNER_API_URL:?the Planner API base URL, e.g. https://planner.example.com/api}
      - BARCODE_SYNC_TOKEN=${BARCODE_SYNC_TOKEN:?must match the Planner's BARCODE_SYNC_TOKEN}
      - PLANNER_SYNC_TIMEOUT=${PLANNER_SYNC_TIMEOUT:-15}
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Kolkata}
      - ODOO_URL=${ODOO_URL:-}
      - ODOO_DB=${ODOO_DB:-}
      - ODOO_USERNAME=${ODOO_USERNAME:-}
      - ODOO_PASSWORD=${ODOO_PASSWORD:-}
    ports:
      - "${PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:8000/healthz || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
